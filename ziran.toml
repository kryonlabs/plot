[package]
name = "plot"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "0c4465a461df0bba473cf249ed30e60d94a6d364"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "6816ed78665e10525a3a0a7a43e182f2fa51a0ac"

[exports]
# Public module is Plot; the lowercase export is retained for older imports.
plot = "src/Plot/module.zi"
Plot = "src/Plot/module.zi"
# The chart surface alone, for apps that draw their own series.
PlotWidget = "src/PlotWidget/module.zi"

band_chart = "src/band_chart.zi"
band_chart_props = "src/band_chart_props.zi"
band_chart_host = "src/band_chart_host.zi"

[tool.kryon]
default_profile = "cairo"

[tool.kryon.profiles.cairo]
backend = "desktop"
