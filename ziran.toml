[package]
name = "plot"
entry = "src/app.tsx"
module_roots = ["src", "src/tsx", "examples", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "e265c54ed682caa23422ecec597c073dff61dc1e"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "f4bda4733366bea32e64fa632906410242230122"

[exports]
# Public module is Plot; the lowercase export is retained for older imports.
plot = "src/Plot/module.zi"
Plot = "src/Plot/module.zi"
# The chart surface alone, for apps that draw their own series.
PlotWidget = "src/PlotWidget/module.zi"
"tsx/plot" = "src/tsx/plot_view.tsx"
"tsx/charts" = "src/tsx/chart_views.tsx"
"tsx/dashboard" = "src/tsx/dashboard_chart_views.tsx"

band_chart = "src/band_chart.zi"
band_chart_props = "src/band_chart_props.zi"
band_chart_host = "src/band_chart_host.zi"
"examples/bandchart" = "examples/bandchart_scene.tsx"
"examples/candlechart" = "examples/candlechart_scene.tsx"
"examples/linechart" = "examples/linechart_scene.tsx"
"examples/linechartcompare" = "examples/linechartcompare_scene.tsx"
"examples/plotbars" = "examples/plotbars_scene.tsx"
"examples/plotlines" = "examples/plotlines_scene.tsx"

[tool.kryon]
default_profile = "cairo"

[tool.kryon.profiles.cairo]
backend = "desktop"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
