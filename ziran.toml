[package]
name = "Plot"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.Kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[exports]
Plot = "src/Plot/module.zi"

[tool.kryon]
default_profile = "cairo"

[tool.kryon.profiles.cairo]
backend = "desktop"
