[package]
name = "plot"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[exports]
# Public module is Plot; the lowercase export is retained for older imports.
plot = "src/module.zi"
Plot = "src/module.zi"
# The chart surface alone, for apps that draw their own series.
PlotWidget = "src/PlotWidget/module.zi"

[tool.kryon]
default_profile = "cairo"

[tool.kryon.profiles.cairo]
backend = "desktop"
