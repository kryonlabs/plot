[package]
name = "plot"
entry = "src/app.zi"
module_roots = ["src", "examples", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "9432a110709c4a4f72c4f732fcfc368e15213a54"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "facaace35051336a2a993d90d1bb7d7396543852"

[exports]
# Public module is Plot; the lowercase export is retained for older imports.
plot = "src/Plot/module.zi"
Plot = "src/Plot/module.zi"
# The chart surface alone, for apps that draw their own series.
PlotWidget = "src/PlotWidget/module.zi"

band_chart = "src/band_chart.zi"
band_chart_props = "src/band_chart_props.zi"
band_chart_host = "src/band_chart_host.zi"

[tool.kryon]
default_profile = "cairo"

[tool.kryon.profiles.cairo]
backend = "desktop"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
